name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  PILOTTRACE_COMMIT: d402c09cfdd3282262efc3cecc290905623ad98d

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check out pinned pilottrace (unmodified, public)
        uses: actions/checkout@v7
        with:
          repository: sparkainlp-x/pilottrace
          ref: ${{ env.PILOTTRACE_COMMIT }}
          path: .deps/pilottrace
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build the static replay page (SYNTHETIC)
        run: python -W error scripts/build_site.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
