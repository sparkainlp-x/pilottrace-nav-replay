name: ci

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PILOTTRACE_COMMIT: d402c09cfdd3282262efc3cecc290905623ad98d

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - name: Check out pinned pilottrace (unmodified, public)
        uses: actions/checkout@v7
        with:
          repository: sparkainlp-x/pilottrace
          ref: ${{ env.PILOTTRACE_COMMIT }}
          path: .deps/pilottrace
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip ruff pytest pytest-cov
      - name: Lint
        run: ruff check .
      - name: Tests (coverage gate 95%, warnings are errors)
        run: python -m pytest --cov --cov-report=term-missing
      - name: Committed evidence is reproduced byte for byte
        run: |
          python -m pilottrace_nav run --out-dir "$RUNNER_TEMP/out" --quiet
          python -m pilottrace_nav verify "$RUNNER_TEMP/out/provenance_manifest.json"
          for f in evidence_report.json evidence_report.md provenance_manifest.json; do
            cmp "$RUNNER_TEMP/out/$f" "examples/output/$f"
          done
      - name: Build the Pages view
        run: python -W error scripts/build_site.py "$RUNNER_TEMP/site"
      - name: Install and run the console script
        run: |
          python -m pip install .
          cd "$RUNNER_TEMP"
          PYTHONPATH="$GITHUB_WORKSPACE/.deps/pilottrace" pilottrace-nav-replay --version
          PYTHONPATH="$GITHUB_WORKSPACE/.deps/pilottrace" pilottrace-nav-replay run --scenarios nominal --out-dir smoke --quiet
